name: Build Maccy Capture

on:
  push:
    branches: [master, main]
    tags: ["capture-v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package universal macOS app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Set build directories
        shell: bash
        run: |
          echo "MACCY_DERIVED_DATA=$RUNNER_TEMP/MaccyCaptureDerivedData" >> "$GITHUB_ENV"
          echo "MACCY_DIST_DIR=$RUNNER_TEMP/MaccyCapture-dist" >> "$GITHUB_ENV"
          echo "MACCY_BUILD_VERSION=$((1000 + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Validate update scripts and synthetic feed generation
        run: |
          for script in script/package_release.sh script/setup_release_signing.sh script/publish_prerelease.sh script/publish_stable.sh script/sign_update_archive.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s script -p 'test_update_feed.py'

      - name: Run capture regression tests with synthetic images
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$MACCY_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/MaccyCaptureTests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -only-testing:MaccyTests/AppIdentityTests \
            -only-testing:MaccyTests/JSONFormatterTests \
            -only-testing:MaccyTests/LiquidGlassTests \
            -only-testing:MaccyTests/SoftwareUpdaterTests \
            -only-testing:MaccyTests/AppLanguageTests \
            -only-testing:MaccyTests/ScreenshotCaptureTests \
            -only-testing:MaccyTests/ScreenshotSelectionTests \
            -only-testing:MaccyTests/ScreenshotAnnotationTests \
            -only-testing:MaccyTests/SharedStateTests/ClipboardTests \
            -only-testing:MaccyTests/SharedStateTests/HistoryTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            test 2>&1 | tee "$RUNNER_TEMP/MaccyCapture-tests.log"

      - name: Package default-branch Release app
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          MACCY_RELEASE_SIGNING_IDENTITY: ${{ secrets.MACCY_RELEASE_SIGNING_IDENTITY }}
        run: bash script/package_release.sh --ci-sign

      - name: Package ad-hoc Release artifacts for Apple Silicon and Intel
        if: >-
          github.event_name == 'pull_request' ||
          github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: bash script/package_release.sh

      - name: Sign repository update archive
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash script/sign_update_archive.sh

      - name: Upload application packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Maccy-Capture-macOS-universal-${{ github.run_number }}
          path: |
            ${{ env.MACCY_DIST_DIR }}/*.zip
            ${{ env.MACCY_DIST_DIR }}/*.dmg
            ${{ env.MACCY_DIST_DIR }}/SHA256SUMS.txt
            ${{ env.MACCY_DIST_DIR }}/BUILD-INFO.txt
            ${{ env.MACCY_DIST_DIR }}/UPDATE-METADATA.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Maccy-Capture-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/MaccyCapture-tests.log
            ${{ runner.temp }}/MaccyCaptureTests.xcresult
            ${{ env.MACCY_DERIVED_DATA }}/maccy-release-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Update rolling test release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download verified application packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Maccy-Capture-macOS-universal-${{ github.run_number }}
          path: ${{ runner.temp }}/MaccyCapture-dist

      - name: Publish or update test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MACCY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MACCY_DIST_DIR: ${{ runner.temp }}/MaccyCapture-dist
        run: bash script/publish_prerelease.sh
