name: Publish stable release

on:
  push:
    tags: ["maccy-capture-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag, e.g. maccy-capture-v2.9.0 (an existing tag, or the default branch head)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable release from a verified master build
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out publishing script and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MACCY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MACCY_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash script/publish_stable.sh
